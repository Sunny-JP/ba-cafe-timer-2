name = "ba-cafe-timer-2"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [
  { pattern = "cafetimer2.rabbit1.cc", custom_domain = true }
]

[build]
command = "npm run build"
watch_dir = ["public/js", "public/css"]

[assets]
directory = "./public"
run_worker_first = ["/api/*"]

[triggers]
crons = ["* * * * *"]

# 無料プランで使える Durable Object は SQLite 版だけ
[[durable_objects.bindings]]
name = "USER_STORE"
class_name = "UserStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserStore"]

[[ratelimits]]
name = "READ_LIMIT"
namespace_id = "1003"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "WRITE_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "HEAVY_LIMIT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[vars]
FIREBASE_PROJECT_ID = "ba-cafe-timer-2"

[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true

[placement]
mode = "smart"


