name = "ba-cafe-timer-2"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[build]
command = "npm run build"
watch_dir = ["public/js", "public/css"]

[assets]
directory = "./public"
run_worker_first = ["/api/*"]

[triggers]
crons = ["* * * * *"]

# ユーザーごとに Drive への書き込みを1本ずつ処理する (src/worker.js の UserStore)。
# 無料プランは SQLite 版のみ使える (何も保存しないが、クラスの登録として必要)
[[durable_objects.bindings]]
name = "USER_STORE"
class_name = "UserStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserStore"]

[vars]
FIREBASE_PROJECT_ID = "ba-cafe-timer-2"

[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true

[placement]
mode = "smart"


