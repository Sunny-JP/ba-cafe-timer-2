name = "ba-cafe-timer-2"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
run_worker_first = ["/api/*"]

[triggers]
crons = ["* * * * *"]

[vars]
FIREBASE_PROJECT_ID = "ba-cafe-timer-2"

[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true


