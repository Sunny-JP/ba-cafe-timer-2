<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cafe Timer 2</title>
    <meta name="description" content="ブルーアーカイブ カフェのタップ間隔とチケットを管理するタイマー" />
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://cafetimer2.rabbit1.cc/" />
    <!-- SNS で共有したときのカード (OGP / X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cafe Timer 2" />
    <meta property="og:title" content="Cafe Timer 2" />
    <meta property="og:description" content="ブルーアーカイブ カフェのタップ間隔とチケットを管理するタイマー" />
    <meta property="og:url" content="https://cafetimer2.rabbit1.cc/" />
    <meta property="og:image" content="https://cafetimer2.rabbit1.cc/img/ogp.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cafe Timer 2" />
    <meta name="twitter:description" content="ブルーアーカイブ カフェのタップ間隔とチケットを管理するタイマー" />
    <meta name="twitter:image" content="https://cafetimer2.rabbit1.cc/img/ogp.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/img/icon.svg" />
    <link rel="modulepreload" href="/dist/app.js" />
    <!-- 起動時の ID トークン更新 (Firebase Auth) を待たせない -->
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- フォントは表示をブロックしない(読み込み後に切り替わる) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Noto+Sans+JP:wght@400;500&display=swap" media="print" data-async-css />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Noto+Sans+JP:wght@400;500&display=swap" /></noscript>
    <link rel="stylesheet" href="/dist/app.css" />
    <script src="/js/theme-init.js"></script>
  </head>
  <body>
    <div id="loading" class="center loader" role="status">
      <span class="spinner" aria-hidden="true"></span>
      <p data-i18n="loading"></p>
    </div>

    <main id="login" class="center" hidden>
      <h1>Cafe Timer 2</h1>
      <p data-i18n="loginText"></p>
      <button id="login-btn" class="primary" data-i18n="loginBtn"></button>
      <div class="login-links">
        <div id="login-lang"></div>
        <button id="about-btn" class="ghost" data-i18n="docAbout"></button>
        <button id="guide-btn" class="ghost" data-i18n="docGuide"></button>
        <a id="site-link" href="https://rabbit1.cc" target="_blank" rel="noopener noreferrer" data-i18n="officialSite"></a>
      </div>
    </main>

    <div id="app" hidden>
      <div id="reauth" class="banner" hidden>
        <span data-i18n="reauthMsg"></span>
        <button id="reauth-btn" data-i18n="reauthBtn"></button>
      </div>
      <header class="appbar">
        <button id="home-btn" class="home" data-act="home">Cafe Timer 2</button>
        <div class="actions">
          <span id="sync" class="sync" role="status" hidden></span>
          <button id="theme-btn" class="icon" data-act="theme-toggle"></button>
          <button id="menu-btn" class="icon" data-i18n-aria="menu"></button>
        </div>
      </header>
      <div id="notice" hidden></div>
      <main id="view"></main>
      <aside id="ads" class="ads" aria-label="PR" hidden></aside>
      <nav role="tablist">
        <button role="tab" data-tab="timer" aria-selected="true" data-i18n-aria="navTimer"></button>
        <button role="tab" data-tab="calendar" aria-selected="false" data-i18n-aria="navCalendar"></button>
        <button role="tab" data-tab="bond" aria-selected="false" data-i18n-aria="navBond"></button>
      </nav>
    </div>

    <dialog id="menu"><div id="menu-body"></div></dialog>

    <dialog id="about">
      <div id="about-body" class="doc"></div>
      <div class="confirm-actions"><button id="about-close" class="primary" data-i18n="close"></button></div>
    </dialog>

    <dialog id="confirm">
      <p id="confirm-msg"></p>
      <div class="confirm-actions">
        <button id="confirm-cancel" data-i18n="cancel"></button>
        <button id="confirm-ok" class="primary"></button>
      </div>
    </dialog>
    <dialog id="busy" class="loader">
      <span class="spinner" aria-hidden="true"></span>
      <p id="busy-msg" role="status" aria-live="polite"></p>
      <progress id="busy-bar" max="3" value="0"></progress>
    </dialog>
    <div id="toast" role="status" hidden></div>

    <script type="module" src="/dist/app.js"></script>
  </body>
</html>
