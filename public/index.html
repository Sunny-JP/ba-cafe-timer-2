<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cafe Timer</title>
  <meta name="description" content="ブルーアーカイブ カフェのタップ間隔とチケットを管理するタイマー">
  <meta name="theme-color" content="#4355b9">
  <script>
    // 描画前にテーマを反映してちらつきを防ぐ
    try {
      const r = document.documentElement, m = localStorage.getItem('ct.mode'), c = localStorage.getItem('ct.accent');
      if (m === 'light' || m === 'dark') r.dataset.mode = m;
      if (c && /^#[0-9a-f]{6}$/i.test(c)) r.style.setProperty('--accent', c);
    } catch {}
  </script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Noto+Sans+JP:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
  <p id="loading" class="center">読み込み中…</p>

  <main id="login" class="center" hidden>
    <h1>Cafe Timer</h1>
    <p>Google アカウントでログインすると、記録はあなたの Google Drive に保存されます。</p>
    <button id="login-btn" class="primary">Google でログイン</button>
  </main>

  <div id="app" hidden>
    <div id="reauth" class="banner" hidden>
      <span>Drive の認証が切れました。</span>
      <button id="reauth-btn">再認証</button>
    </div>
    <header class="appbar">
      <span>Cafe Timer</span>
      <div class="actions">
        <button id="theme-btn" class="icon" data-act="theme-toggle"></button>
        <button id="menu-btn" class="icon" aria-label="メニュー"></button>
      </div>
    </header>
    <main id="view"></main>
    <nav>
      <button data-tab="timer" aria-selected="true" aria-label="タイマー"></button>
      <button data-tab="calendar" aria-label="カレンダー"></button>
      <button data-tab="bond" aria-label="絆"></button>
    </nav>
  </div>

  <dialog id="menu"><div id="menu-body"></div></dialog>

  <dialog id="content" autofocus>
    <div id="content-body"></div>
    <button id="content-close" class="primary">閉じる</button>
  </dialog>
  <div id="toast" role="status" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
