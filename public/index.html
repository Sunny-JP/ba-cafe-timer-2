<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Cafe Timer</title>
  <meta name="description" content="ブルーアーカイブ カフェのタップ間隔とチケットを管理するタイマー">
  <meta name="theme-color" content="#000000">
  <script>
    // 描画前にテーマを反映してちらつきを防ぐ
    try {
      const r = document.documentElement, m = localStorage.getItem('ct.mode'), c = localStorage.getItem('ct.accent');
      if (m === 'light' || m === 'dark') r.dataset.mode = m;
      if (c && /^#[0-9a-f]{6}$/i.test(c)) r.style.setProperty('--accent', c);
    } catch {}
  </script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Noto+Sans+JP:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
  <div id="loading" class="center loader" role="status">
    <span class="spinner" aria-hidden="true"></span>
    <p data-i18n="loading"></p>
  </div>

  <main id="login" class="center" hidden>
    <h1>Cafe Timer</h1>
    <p data-i18n="loginText"></p>
    <button id="login-btn" class="primary" data-i18n="loginBtn"></button>
    <div class="login-links">
      <div id="login-lang"></div>
      <button id="about-btn" class="ghost" data-i18n="docAbout"></button>
      <a id="site-link" href="https://rabbit1.cc" target="_blank" rel="noopener noreferrer" data-i18n="officialSite"></a>
    </div>
  </main>

  <div id="app" hidden>
    <div id="reauth" class="banner" hidden>
      <span data-i18n="reauthMsg"></span>
      <button id="reauth-btn" data-i18n="reauthBtn"></button>
    </div>
    <header class="appbar">
      <button id="home-btn" class="home" data-act="home">Cafe Timer</button>
      <div class="actions">
        <button id="theme-btn" class="icon" data-act="theme-toggle"></button>
        <button id="menu-btn" class="icon" data-i18n-aria="menu"></button>
      </div>
    </header>
    <main id="view"></main>
    <nav>
      <button data-tab="timer" aria-selected="true" data-i18n-aria="navTimer"></button>
      <button data-tab="calendar" data-i18n-aria="navCalendar"></button>
      <button data-tab="bond" data-i18n-aria="navBond"></button>
    </nav>
  </div>

  <dialog id="menu"><div id="menu-body"></div></dialog>

  <dialog id="about">
    <div id="about-body" class="doc"></div>
    <div class="confirm-actions"><button id="about-close" class="primary" data-i18n="close"></button></div>
  </dialog>

  <dialog id="update">
    <h2 data-i18n="updateTitle"></h2>
    <div id="update-body" class="doc"></div>
    <div class="update-foot">
      <label><input type="checkbox" id="update-hide"><span data-i18n="updateHide"></span></label>
      <button id="update-ok" class="primary" data-i18n="ok"></button>
    </div>
  </dialog>

  <dialog id="confirm">
    <p id="confirm-msg"></p>
    <div class="confirm-actions">
      <button id="confirm-cancel" data-i18n="cancel"></button>
      <button id="confirm-ok" class="primary"></button>
    </div>
  </dialog>
  <dialog id="busy" class="loader" role="status" aria-live="polite">
    <span class="spinner" aria-hidden="true"></span>
    <p id="busy-msg"></p>
    <progress id="busy-bar" max="3" value="0"></progress>
  </dialog>
  <div id="toast" role="status" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
