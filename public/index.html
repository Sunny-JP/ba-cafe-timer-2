<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cafe Timer</title>
  <meta name="description" content="ブルーアーカイブ カフェのタップ間隔とチケットを管理するタイマー">
  <meta name="theme-color" content="#1b6fd1">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/icon.svg">
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
  <p id="loading" class="center">読み込み中…</p>

  <main id="login" class="center" hidden>
    <h1>Cafe Timer</h1>
    <p>Google アカウントでログインすると、記録はあなたの Google Drive に保存されます。</p>
    <button id="login-btn" class="primary">Google でログイン</button>
  </main>

  <div id="app" hidden>
    <div id="reauth" class="banner" hidden>
      <span>Drive の認証が切れました。</span>
      <button id="reauth-btn">再認証</button>
    </div>
    <main id="view"></main>
    <nav>
      <button data-tab="timer" aria-selected="true">タイマー</button>
      <button data-tab="calendar">カレンダー</button>
      <button data-tab="bond">絆</button>
      <button data-tab="settings">設定</button>
    </nav>
  </div>

  <dialog id="content">
    <div id="content-body"></div>
    <button id="content-close">閉じる</button>
  </dialog>
  <div id="toast" role="status" hidden></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
