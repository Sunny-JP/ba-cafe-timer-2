<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>通知 | Cafe Timer 2 管理</title>
    <script>
      try {
        const r = document.documentElement,
          m = localStorage.getItem("ct.mode"),
          c = localStorage.getItem("ct.accent");
        if (m === "light" || m === "dark") r.dataset.mode = m;
        if (c && /^#[0-9a-f]{6}$/i.test(c)) r.style.setProperty("--accent", c);
      } catch {}
    </script>
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Noto+Sans+JP:wght@400;500&display=swap" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body>
    <main id="login" class="center" hidden>
      <h1>Cafe Timer 2 管理</h1>
      <button id="login-btn" class="primary">Google でログイン</button>
    </main>

    <div id="admin" hidden>
      <div id="shell"></div>
      <div id="content" hidden>
        <h2>テスト通知</h2>
        <p class="note">このアカウントで通知をオンにしている端末へ送ります(他のユーザーには送りません)。</p>
        <div class="row"><button id="test-push" class="primary">テスト通知を送る</button></div>
        <p id="push-result" class="result"></p>
      </div>
    </div>

    <div id="toast" role="status" hidden></div>
    <script type="module" src="/js/admin/push.js"></script>
  </body>
</html>
