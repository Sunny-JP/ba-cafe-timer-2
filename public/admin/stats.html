<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>統計 | Cafe Timer 管理</title>
  <script>
    try {
      const r = document.documentElement, m = localStorage.getItem('ct.mode'), c = localStorage.getItem('ct.accent');
      if (m === 'light' || m === 'dark') r.dataset.mode = m;
      if (c && /^#[0-9a-f]{6}$/i.test(c)) r.style.setProperty('--accent', c);
    } catch {}
  </script>
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&family=Noto+Sans+JP:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <main id="login" class="center" hidden>
    <h1>Cafe Timer 管理</h1>
    <button id="login-btn" class="primary">Google でログイン</button>
  </main>

  <div id="admin" hidden>
    <div id="shell"></div>
    <div id="content" hidden>
      <h2>統計</h2>
      <p class="note">個人を特定できる情報は保存せず、件数のみを集計しています。少人数(<span id="kanon">5</span>人未満)の項目は「&lt;5」と表示します。日付は UTC です。</p>
      <div class="cards" id="cards"></div>
      <div class="row" style="align-items: start">
        <div style="flex: 1 1 260px"><h2>日別タップ数 (直近30日)</h2><div class="scroll"><table class="tbl" id="daily"></table></div></div>
        <div style="flex: 1 1 260px"><h2>月別タップ数</h2><div class="scroll"><table class="tbl" id="monthly"></table></div></div>
      </div>
      <div>
        <h2>キャラ別の絆</h2>
        <div class="scroll" style="max-height: 480px"><table class="tbl" id="bonds"></table></div>
        <p class="note">「N以上」は、そのランク以上を記録したユーザー数です(1人は1回だけ数えます)。</p>
      </div>
    </div>
  </div>

  <div id="toast" role="status" hidden></div>
  <script type="module" src="/js/admin/stats.js"></script>
</body>
</html>
